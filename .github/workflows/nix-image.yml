name: nix-image

on:
  workflow_call:
    inputs:
      checks:
        description: Names under checks.<system>.
        type: string
        default: ""
      images:
        description: Flake attributes of nix2container images.
        type: string
        default: image
      lockfiles:
        description: Files besides flake.lock that key the Nix cache.
        type: string
        default: ""
      integration:
        description: A command run outside the Nix sandbox, after the images.
        type: string
        default: ""
      bwrap:
        description: Allow unprivileged user namespaces, for checks that run bwrap.
        type: boolean
        default: false
      push:
        description: Push the images.
        type: boolean
        default: true
    outputs:
      images:
        description: 'JSON object, flake attribute to name@digest.'
        value: ${{ jobs.build.outputs.images }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.push.outputs.images || '{}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ubuntu's AppArmor policy: "setting up uid map: Permission denied".
      - if: inputs.bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - id: key
        env:
          LOCKFILES: ${{ inputs.lockfiles }}
        run: |
          # shellcheck disable=SC2086
          echo "hash=$(sha256sum flake.lock $LOCKFILES | sha256sum | cut -c1-64)" >>"$GITHUB_OUTPUT"

      # Other branches can restore the default branch's caches, not each other's.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-ci-v1-${{ runner.os }}-${{ steps.key.outputs.hash }}
          restore-prefixes-first-match: nix-ci-v1-${{ runner.os }}-
          save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          gc-max-store-size-linux: 6G

      - name: Checks
        if: inputs.checks != ''
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          system=$(nix config show system)
          failed=0
          for check in $CHECKS; do
            echo "::group::check: $check"
            start=$SECONDS
            if nix build -L --no-link ".#checks.$system.$check"; then
              result="✅"
            else
              result="❌"
              failed=1
            fi
            echo "::endgroup::"
            [ "$result" = "✅" ] || echo "::error title=check $check failed::nix build .#checks.$system.$check failed"
            echo "| check | $check | $result | $((SECONDS - start)) s |" >>"$RUNNER_TEMP/summary"
          done
          exit "$failed"

      - name: Images
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          failed=0
          for image in $IMAGES; do
            echo "::group::image: $image"
            start=$SECONDS
            if nix build -L --no-link ".#$image" ".#$image.copyTo"; then
              result="✅"
            else
              result="❌"
              failed=1
            fi
            echo "::endgroup::"
            [ "$result" = "✅" ] || echo "::error title=image $image failed::nix build .#$image failed"
            echo "| image | $image | $result | $((SECONDS - start)) s |" >>"$RUNNER_TEMP/summary"
          done
          exit "$failed"

      - name: Integration
        if: inputs.integration != ''
        env:
          INTEGRATION: ${{ inputs.integration }}
        run: |
          start=$SECONDS
          status=0
          bash -euo pipefail -c "$INTEGRATION" || status=$?
          result="✅"
          [ "$status" -eq 0 ] || { result="❌"; echo "::error title=integration failed::exit status $status"; }
          echo "| integration | outside the sandbox | $result | $((SECONDS - start)) s |" >>"$RUNNER_TEMP/summary"
          exit "$status"

      - id: tags
        if: inputs.push
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tags=""
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            tags="sha-$GITHUB_SHA main"
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            tags="pr-$PR pr-$PR-${HEAD_SHA:0:7}"
          fi
          echo "tags=$tags" >>"$GITHUB_OUTPUT"

      - name: Push
        id: push
        if: steps.tags.outputs.tags != ''
        env:
          IMAGES: ${{ inputs.images }}
          TAGS: ${{ steps.tags.outputs.tags }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          (umask 077 && printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" >"$REGISTRY_AUTH_FILE")
          refs='{}'
          for image in $IMAGES; do
            name=$(nix eval --raw ".#$image.imageName")
            for tag in $TAGS; do
              nix run ".#$image.copyTo" -- --digestfile "$RUNNER_TEMP/digest" "docker://$name:$tag"
            done
            ref="$name@$(cat "$RUNNER_TEMP/digest")"
            refs=$(jq -c --arg i "$image" --arg r "$ref" '. + {($i): $r}' <<<"$refs")
            echo "| $image | \`$ref\` | ${TAGS// /, } |" >>"$RUNNER_TEMP/pushed"
          done
          echo "images=$refs" >>"$GITHUB_OUTPUT"
          jq -n --arg c "$GITHUB_SHA" --argjson i "$refs" '{commit: $c, images: $i}' >"$RUNNER_TEMP/image-digests.json"

      # Releases read digests from here, not from registry tags, which any
      # workflow that can write packages can move.
      - if: steps.push.outcome == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests
          path: ${{ runner.temp }}/image-digests.json
          # Capped by the repository's retention setting (default 90).
          retention-days: 400

      - name: Summary
        if: always()
        run: |
          {
            echo "### nix-image · ${GITHUB_REPOSITORY#*/}"
            echo
            echo "| | | Result | Time |"
            echo "|---|---|---|---|"
            cat "$RUNNER_TEMP/summary" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/pushed" ]; then
              echo
              echo "| Pushed | Reference | Tags |"
              echo "|---|---|---|"
              cat "$RUNNER_TEMP/pushed"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
