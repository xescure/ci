name: tag-images
description: Tags images in the registry by digest. Needs Nix and the repository checked out.
inputs:
  images:
    description: 'JSON object, flake attribute to name@digest.'
    required: true
  tags:
    required: true
  token:
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        TAGS: ${{ inputs.tags }}
        GHCR_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
        trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
        (umask 077 && printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
          "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" >"$REGISTRY_AUTH_FILE")
        skopeo=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#skopeo^out')/bin/skopeo
        for ref in $(jq -r '.[]' <<<"$IMAGES"); do
          for tag in $TAGS; do
            "$skopeo" copy --preserve-digests "docker://$ref" "docker://${ref%@*}:$tag"
            echo "tagged $ref as $tag"
          done
        done
