name: prod-branch
description: Points a branch at a release's commit. Needs contents write.
inputs:
  branch:
    description: The branch to move.
    default: prod
  commit:
    description: Defaults to the triggering tag's commit.
    default: ""
  token:
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${COMMIT:-$GITHUB_REF}" --jq .sha)
        default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
        status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$default...$sha" --jq .status)
        case "$status" in
          behind | identical) ;;
          *) echo "::error::$sha is not on $default ($status); $BRANCH stays where it is." >&2; exit 1 ;;
        esac
        # Forced: re-running an older release moves the branch back.
        if old=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null); then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$sha" -F force=true >/dev/null
        else
          old=none
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$sha" >/dev/null
        fi
        echo "$BRANCH: $old -> $sha"
        echo "**$BRANCH** now points at \`$sha\` (was \`$old\`)." >>"$GITHUB_STEP_SUMMARY"
